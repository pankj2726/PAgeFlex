<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <title>PageFlex – Edit, merge, and adapt PDFs instantly.</title>
    <meta
      name="description"
      content="A modern PDF editor that respects your time and your data. Drop your files into a secure, frictionless environment to split, convert, and format documents exactly the way you need them."
    />
    <meta property="og:site_name" content="PageFlex" />
    <meta property="og:title" content="PageFlex – Edit, merge, and adapt PDFs instantly." />
    <meta
      property="og:description"
      content="A modern PDF editor that respects your time and your data. Drop your files into a secure, frictionless environment to split, convert, and format documents exactly the way you need them."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23C15F3C'/%3E%3Cpath d='M9.5 6.5h9L23.5 11.5V25.5h-14z' fill='%23FAF9F5'/%3E%3Cpath d='M18.5 6.5v5h5z' fill='%23EBDBBC'/%3E%3Cpath d='M12 18.4c1.5-2 3-2 4.5 0s3 2 4.5 0' fill='none' stroke='%23C15F3C' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      try {
        var t = localStorage.getItem("qf-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PageFlex needs JavaScript because all PDF processing happens locally in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
